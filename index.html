<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media voti</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2a6fdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--muted:#6b6a65;--accent:#2a6fdb;--accent-fg:#fff;--border:#e2e0d8;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--fg:#ecebe6;--card:#222220;--muted:#9c9b94;--accent:#6aa3ff;--accent-fg:#101010;--border:#34332f;--danger:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:38px;font-weight:700;line-height:1}
.code{font-size:24px;font-weight:700;letter-spacing:1px;margin:10px 0;word-break:break-all}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:10px 14px}
button.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.d{color:var(--danger)}
button.s{padding:6px 10px;font-size:14px}
.mat{text-align:left;padding:14px;margin-bottom:8px;width:100%}
.mat b{font-size:17px}
.avg{font-size:20px;font-weight:700}
input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--fg)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f{display:flex;gap:10px;margin-bottom:10px}
.f>div{flex:1}
.g{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:14px;min-height:18px;margin:4px 0}
details summary{cursor:pointer;font-weight:600}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
/* ====== Configurazione di Firebase ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCMvk1zGyc9E44VTr3A3DdhGpLudFECyjY",
  authDomain: "media-voti-d6c1e.firebaseapp.com",
  projectId: "media-voti-d6c1e",
  storageBucket: "media-voti-d6c1e.firebasestorage.app",
  messagingSenderId: "196783369517",
  appId: "1:196783369517:web:ede3d7dbbd5b640501b7a4"
};
/* ======================================== */

// M = elenco delle materie: [{n:"Nome", l:[{v:voto, p:peso}, ...]}, ...]
let CODE="",M=[],T=0,cur=null,edit=null,del=null,dm=false,ex=false,err="",e2="",msg="",nuovo="",st="",fb=null,ref=null,unsub=null;
try{CODE=localStorage.getItem("voti-code")||""}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const fmt=c=>c.replace(/(.{4})/g,"$1-").replace(/-$/,"");
const f2=x=>x===null?"–":x.toFixed(2);
const okV=y=>y&&typeof y.v==="number"&&typeof y.p==="number";

// Legge i dati nel formato nuovo {m:[...]} oppure in quello vecchio {Materia:[...]}
function parse(o){
  const out=[];
  if(o&&Array.isArray(o.m)){
    o.m.forEach(x=>{if(x&&typeof x.n==="string"&&Array.isArray(x.l))out.push({n:x.n,l:x.l.filter(okV)})});
  }else if(o&&typeof o==="object"){
    Object.keys(o).forEach(k=>{if(Array.isArray(o[k]))out.push({n:k,l:o[k].filter(okV)})});
  }
  return out;
}
function loadLocal(){
  M=[];T=0;
  try{
    const s=localStorage.getItem("voti-d-"+CODE);
    if(s)M=parse(JSON.parse(s));
    T=parseInt(localStorage.getItem("voti-t-"+CODE))||0;
  }catch(e){}
}
function loc(){try{localStorage.setItem("voti-d-"+CODE,JSON.stringify({m:M}));localStorage.setItem("voti-t-"+CODE,String(T))}catch(e){}}
function avg(l){if(!l.length)return null;let s=0,w=0;l.forEach(x=>{s+=x.v*x.p;w+=x.p});return w>0?s/w:null}
function gen(){const a=M.map(m=>avg(m.l)).filter(x=>x!==null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function setSt(s){st=s;const e=$("st");if(e)e.textContent=s}

/* ---------- sincronizzazione ---------- */
async function connect(){
  if(unsub){unsub();unsub=null}
  ref=null;
  if(!CODE)return;
  setSt("Sincronizzazione…");
  try{
    if(!fb){
      const A=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const F=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      fb={F,db:F.getFirestore(A.initializeApp(FIREBASE_CONFIG))};
    }
    ref=fb.F.doc(fb.db,"profili",CODE);
    unsub=fb.F.onSnapshot(ref,s=>{
      if(s.exists()){
        const r=s.data();
        if(r.t>T){
          M=parse(r.d);T=r.t;loc();
          if(cur!==null&&cur>=M.length)cur=null;
          const a=document.activeElement;
          if(!a||a.tagName!=="INPUT")render();
        }else if(T>r.t){push();return}
      }else if(T>0){push();return}
      setSt("☁️ Sincronizzato");
    },()=>setSt("Offline: i voti sono salvati sul dispositivo"));
  }catch(e){setSt("Offline: i voti sono salvati sul dispositivo")}
}
function push(){
  if(!ref)return;
  fb.F.setDoc(ref,{d:{m:M},t:T}).then(()=>setSt("☁️ Sincronizzato")).catch(()=>setSt("Salvataggio online non riuscito"));
}
function save(){T=Date.now();loc();push()}

/* ---------- schermate ---------- */
function render(){
  let h="";
  if(!CODE){
    h+='<h1>Media voti</h1>';
    if(!nuovo){
      h+='<div class="card"><b>Primo accesso</b><p class="muted">Il codice collega i tuoi dispositivi. Chi lo conosce può vedere i tuoi voti: tienilo per te.</p><button class="p" onclick="creaCodice()">Crea il mio codice</button></div>';
    }else{
      h+='<div class="card"><b>Il tuo codice</b><div class="code">'+fmt(nuovo)+'</div><p class="muted">Annotalo: ti serve per collegare gli altri dispositivi e non si può recuperare.</p><button class="p" onclick="entra(\''+nuovo+'\')">Ho annotato, continua</button></div>';
    }
    h+='<div class="card"><b>Ho già un codice</b><div style="margin:10px 0"><input id="cd" placeholder="xxxx-xxxx-xxxx" autocapitalize="none" autocomplete="off"></div><div class="err">'+err+'</div><button onclick="entra()">Entra</button></div>';
  }else if(cur===null){
    let n=0;M.forEach(m=>n+=m.l.length);
    h+='<h1>Media voti</h1><div class="card"><div class="muted">Media generale</div><div class="big">'+f2(gen())+'</div><div class="muted">'+n+' voti inseriti</div></div>';
    if(!M.length)h+='<p class="muted">Non hai ancora materie: aggiungi la prima qui sotto.</p>';
    M.forEach((m,i)=>{
      h+='<button class="mat" onclick="go('+i+')"><div class="row"><div><b>'+esc(m.n)+'</b><div class="muted">'+m.l.length+' voti</div></div><div class="avg">'+f2(avg(m.l))+'</div></div></button>';
    });
    h+='<div class="card"><b>Nuova materia</b><div style="margin:10px 0"><input id="nm" placeholder="Es. Storia" maxlength="40" autocomplete="off"></div><div class="err">'+e2+'</div><button class="p" onclick="addM()">Aggiungi materia</button></div>';
    h+='<div class="muted" id="st" style="margin:0 4px 12px">'+st+'</div>';
    h+='<div class="card"><details><summary>Codice e backup</summary><p class="muted">Il tuo codice:</p><div class="code">'+fmt(CODE)+'</div>';
    h+='<p class="muted">Backup: crea il testo e conservalo, oppure incollalo qui e premi Importa.</p><textarea id="bk"></textarea><div class="g" style="margin:8px 0"><button class="s" onclick="exp()">Crea backup</button><button class="s" onclick="imp()">Importa</button></div><div class="muted" id="bm">'+msg+'</div>';
    h+='<div style="margin-top:12px"><button class="s d" onclick="esci()">'+(ex?'Sicuro? Annota prima il codice':'Cambia codice / esci')+'</button></div></details></div>';
  }else{
    const m=M[cur],l=m.l;
    h+='<button class="s" onclick="go(null)">← Indietro</button><h1 style="margin-top:12px">'+esc(m.n)+'</h1>';
    h+='<div class="card"><div class="muted">Media materia</div><div class="big">'+f2(avg(l))+'</div></div>';
    h+='<div class="card"><b>'+(edit===null?'Nuovo voto':'Modifica voto')+'</b><div class="f" style="margin-top:10px"><div><label>Voto (0-10)</label><input id="v" inputmode="decimal" value="'+(edit!==null?l[edit].v:'')+'"></div><div><label>Peso % (0-100)</label><input id="p" inputmode="decimal" value="'+(edit!==null?l[edit].p:'100')+'"></div></div><div class="err">'+err+'</div><div class="g"><button class="p" onclick="sv()">'+(edit===null?'Aggiungi':'Salva modifica')+'</button>'+(edit!==null?'<button onclick="annulla()">Annulla</button>':'')+'</div></div>';
    if(!l.length)h+='<p class="muted">Nessun voto per questa materia.</p>';
    l.forEach((x,i)=>{
      h+='<div class="card"><div class="row"><div><span class="avg">'+x.v+'</span> <span class="muted">peso '+x.p+'%</span></div><div class="g"><button class="s" onclick="ed('+i+')">Modifica</button><button class="s d" onclick="dl('+i+')">'+(del===i?'Sicuro?':'Elimina')+'</button></div></div></div>';
    });
    h+='<div class="card"><details'+(e2||dm?' open':'')+'><summary>Modifica materia</summary><div style="margin:10px 0"><label>Nome</label><input id="rn" value="'+esc(m.n)+'" maxlength="40"></div><div class="err">'+e2+'</div><div class="g"><button class="s" onclick="renM()">Rinomina</button><button class="s d" onclick="delM()">'+(dm?'Sicuro? Cancella anche i voti':'Elimina materia')+'</button></div></details></div>';
  }
  $("app").innerHTML=h;
}

/* ---------- azioni ---------- */
function go(i){cur=i;edit=null;del=null;dm=false;err="";e2="";render();window.scrollTo(0,0)}
function num(id){return parseFloat($(id).value.replace(",","."))}
function nomeOk(v,skip){
  if(!v)return "Scrivi il nome della materia.";
  if(M.some((m,i)=>i!==skip&&m.n.toLowerCase()===v.toLowerCase()))return "Esiste già una materia con questo nome.";
  return "";
}
function addM(){
  const v=$("nm").value.trim(),e=nomeOk(v,-1);
  if(e){e2=e;render();return}
  M.push({n:v,l:[]});e2="";save();render();
}
function renM(){
  const v=$("rn").value.trim(),e=nomeOk(v,cur);
  if(e){e2=e;render();return}
  M[cur].n=v;e2="";save();render();
}
function delM(){
  if(!dm){dm=true;render();return}
  M.splice(cur,1);dm=false;cur=null;save();render();
}
function sv(){
  const v=num("v"),p=num("p");
  if(isNaN(v)||v<0||v>10){err="Il voto deve essere tra 0 e 10.";render();return}
  if(isNaN(p)||p<0||p>100){err="Il peso deve essere tra 0 e 100.";render();return}
  const l=M[cur].l;
  if(edit===null)l.push({v:v,p:p});else l[edit]={v:v,p:p};
  edit=null;err="";save();render();
}
function annulla(){edit=null;err="";render()}
function ed(i){edit=i;del=null;err="";render();window.scrollTo(0,0)}
function dl(i){
  if(del===i){M[cur].l.splice(i,1);del=null;save()}else del=i;
  render();
}
function creaCodice(){
  const a="abcdefghjkmnpqrstuvwxyz23456789",r=new Uint32Array(12);
  crypto.getRandomValues(r);
  nuovo=Array.from(r,x=>a[x%a.length]).join("");
  render();
}
function entra(c){
  c=norm(c||$("cd").value);
  if(c.length<10){err="Codice non valido (almeno 10 caratteri).";render();return}
  CODE=c;nuovo="";err="";cur=null;
  try{localStorage.setItem("voti-code",CODE)}catch(e){}
  loadLocal();render();connect();
}
function esci(){
  if(!ex){ex=true;render();return}
  if(unsub){unsub();unsub=null}
  ref=null;ex=false;CODE="";M=[];cur=null;st="";
  try{localStorage.removeItem("voti-code")}catch(e){}
  render();
}
function exp(){
  const t=$("bk");t.value=JSON.stringify({m:M});t.select();
  try{document.execCommand("copy");$("bm").textContent="Backup creato e copiato."}catch(e){$("bm").textContent="Backup creato: copialo a mano."}
}
function imp(){
  try{
    const r=parse(JSON.parse($("bk").value));
    if(!r.length)throw 0;
    M=r;save();msg="Backup importato.";render();
  }catch(e){$("bm").textContent="Testo non valido."}
}
Object.assign(window,{go,sv,annulla,ed,dl,addM,renM,delM,creaCodice,entra,esci,exp,imp});

document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CODE&&!ref)connect()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(CODE)loadLocal();
render();
connect();
</script>
</body>
</html>
